# ==============================================================================
# CRM Platform — High-Performance Production Reverse Proxy (Nginx)
# ==============================================================================
# Objectives:
# 1. Conceal backend remote address (IP & internal port 5000) completely from clients.
# 2. Terminate SSL/TLS with modern cipher suites and HTTP/2.
# 3. Proxy Next.js frontend, Express backend APIs, and Socket.IO WebSockets.
# 4. Strip fingerprinting headers (Server, X-Powered-By).
# 5. Shield internal services with rate limiting and DDoS safeguards.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format that captures upstream response times without leaking tokens
    log_format crm_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream_time=$upstream_response_time host=$host';

    access_log /var/log/nginx/access.log crm_combined;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==========================================================================
    # Security: Server Masking & Fingerprint Suppression
    # ==========================================================================
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Support large Excel imports and reports (up to 30 MB)
    client_max_body_size 30M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting Zones (DDoS & Brute-force protection)
    limit_req_zone $binary_remote_addr zone=crm_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=crm_auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=crm_conn:10m;

    # Upstream Definitions (Resolves to private internal container / host network)
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:5000;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP -> HTTPS Redirect
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME Challenge for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # Main HTTPS Reverse Proxy Server
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates (Configure with Let's Encrypt or custom certs)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern SSL configuration (TLS 1.2 and 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        limit_conn crm_conn 50;

        # ----------------------------------------------------------------------
        # 1. API Reverse Proxy: /api/ -> backend_upstream (Conceals Backend IP)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=crm_api burst=20 nodelay;

            # Forward to internal private backend
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;

            # Standard reverse-proxy headers forwarding real client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Strip upstream headers that leak internal server software or IPs
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;

            # Buffering and timeouts (accommodates large report generation)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }

        # Stricter rate limit on sensitive authentication endpoints
        location /api/auth/login {
            limit_req zone=crm_auth burst=5 nodelay;

            proxy_pass http://backend_upstream/api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }

        # ----------------------------------------------------------------------
        # 2. WebSocket Reverse Proxy: /socket.io/ -> backend_upstream
        # ----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://backend_upstream/socket.io/;
            proxy_http_version 1.1;

            # Essential WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Persistent connection timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # 3. Frontend Next.js Reverse Proxy: / -> frontend_upstream
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;

            # Next.js static asset caching optimizations
            location /_next/static {
                proxy_pass http://frontend_upstream;
                proxy_cache_valid 200 365d;
                add_header Cache-Control "public, max-age=31536000, immutable";
                proxy_hide_header X-Powered-By;
            }
        }
    }
}
