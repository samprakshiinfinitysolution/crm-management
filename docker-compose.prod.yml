# ==============================================================================
# CRM Platform — Production Multi-Container Architecture with Reverse Proxy
# ==============================================================================
# Security Notice:
# Only the reverse proxy (Nginx) binds public ports (80 and 443).
# Backend, PostgreSQL, and Redis have NO public port bindings. They communicate
# exclusively over the isolated internal bridge network 'crm-internal-network'.
# Client browsers never see or connect to the backend IP or port 5000.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy (Public Entry Point)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: crm-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/ssl:/etc/nginx/ssl:ro
      - certbot-challenge:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - crm-internal-network

  # ----------------------------------------------------------------------------
  # 2. Frontend (Next.js SSR & BFF)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Internal Docker DNS: Frontend talks to backend via private bridge network
      - INTERNAL_BACKEND_URL=http://backend:5000
      - BACKEND_URL=http://backend:5000
    expose:
      - "3000"
    # Notice: NO public "ports" section — invisible to the outside internet
    depends_on:
      - backend
    networks:
      - crm-internal-network

  # ----------------------------------------------------------------------------
  # 3. Backend (Node.js / Express / Prisma API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TRUST_PROXY_HOPS=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-crm_secure_password}@postgres:5432/${POSTGRES_DB:-crm_production}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CLIENT_URL=${PUBLIC_DOMAIN:-https://crm.yourcompany.com}
      - ALLOWED_ORIGINS=${PUBLIC_DOMAIN:-https://crm.yourcompany.com}
    expose:
      - "5000"
    # Notice: NO public "ports" section — invisible to the outside internet
    depends_on:
      - postgres
      - redis
    networks:
      - crm-internal-network

  # ----------------------------------------------------------------------------
  # 4. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-crm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crm_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-crm_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    # Notice: NO public "ports" section — invisible to the outside internet
    networks:
      - crm-internal-network

  # ----------------------------------------------------------------------------
  # 5. Redis Cache & Token Blacklist
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    # Notice: NO public "ports" section — invisible to the outside internet
    networks:
      - crm-internal-network

# ------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  crm-internal-network:
    name: crm-internal-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  pgdata:
  redisdata:
  certbot-challenge:
