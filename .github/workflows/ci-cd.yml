name: CRM Platform CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ============================================================
# Backend CI
# ============================================================
jobs:
  backend-ci:
    name: Backend CI (Node.js, Prisma, PostgreSQL & Redis)

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: "${{ secrets.POSTGRES_DB || '' }}"
          POSTGRES_USER: "${{ secrets.DB_username || '' }}"
          POSTGRES_PASSWORD: "${{ secrets.DB_Password || '' }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "${{ secrets.DIRECT_URL || '' }}"
      DIRECT_URL: "${{ secrets.DIRECT_URL || '' }}"

    defaults:
      run:
        working-directory: ./backend

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install Backend Dependencies
        run: npm ci

      # --------------------------------------------------------
      # Prisma
      # --------------------------------------------------------
      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      # --------------------------------------------------------
      # Type check
      # --------------------------------------------------------
      - name: Type Check Backend Application
        run: npx tsc --noEmit

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Backend Application
        run: npm run build

  # ============================================================
  # Frontend CI
  # ============================================================
  frontend-ci:
    name: Frontend CI (Next.js & React)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install Frontend Dependencies
        run: npm ci

      # --------------------------------------------------------
      # Lint
      # --------------------------------------------------------
      - name: Run Frontend Lint
        run: npm run lint

      # --------------------------------------------------------
      # Next.js Build Cache
      # --------------------------------------------------------
      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**.[jt]s', 'frontend/src/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build Frontend Application
        run: npm run build

  # ============================================================
  # Continuous Deployment
  # Main Branch Push Only
  # ============================================================
  deploy:
    name: Deploy to Production (Render & Vercel)

    needs:
      - backend-ci
      - frontend-ci

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Backend Deployment
        run: |
          echo "Triggering Render backend deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # --------------------------------------------------------
      # Vercel
      # --------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ./frontend
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: ./frontend
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          NEXT_PUBLIC_API_URL: "/api"
          NEXT_PUBLIC_TOKEN_KEY: "CRM_Management"

      - name: Deploy Artifacts to Vercel
        working-directory: ./frontend
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
